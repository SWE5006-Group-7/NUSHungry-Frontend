name: E2E Tests

on:
  push:
    branches: ["feat/frontend-ci-pipeline"]
  pull_request:
    branches: ["feat/frontend-ci-pipeline"]
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Set up E2E test environment
        env:
          AWS_REGION: ap-southeast-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          which firefox || echo "Firefox not found"
          firefox --version || echo "Firefox command failed"
          FIREFOX_VER=$(firefox --version 2>&1 | awk '{print $3}' || echo "unknown")
          echo "FIREFOX_VERSION=$FIREFOX_VER" >> $GITHUB_ENV
          echo "Firefox version: $FIREFOX_VER"
          npm install -g selenium-side-runner geckodriver
          selenium-side-runner -c "browserName=MicrosoftEdge" tests/e2e/NUSHungryE2E_V2.side
