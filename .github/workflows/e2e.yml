name: E2E Tests

on:
  push:
    branches: ["feat/frontend-ci-pipeline"]
  pull_request:
    branches: ["feat/frontend-ci-pipeline"]
jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Selenium dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Set up E2E test environment
        run: |
          npm install -g aws-cli
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ secrets.IMAGE_REGISTRY }}
          docker pull ${{ secrets.IMAGE_REGISTRY }}/monolith-backend:latest
          docker compose up -d

          # Wait for services to be healthy
          echo "Waiting for services to be ready..."
          sleep 30

          docker compose ps

          # Wait for frontend to respond
          timeout 60 bash -c 'until curl -s http://localhost:80 > /dev/null; do echo "Waiting for frontend..."; sleep 2; done'
          echo "✓ Frontend is ready"
      - name: Run E2E tests
        run: python tests/e2e/test.py
      - name: Teardown
        run: docker compose down
