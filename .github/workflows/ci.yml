name: CI Pipeline for NUSHungry Frontend

on:
  push:
    branches: ["feat/frontend-ci-pipeline"]
  pull_request:
    branches: ["feat/frontend-ci-pipeline"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

      - name: Check for unused dependencies
        run: npx depcheck || true
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --production=false

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        continue-on-error: true
        with:
          project: "NUSHungry-Frontend-main"
          path: "."
          format: "HTML"
          # Additional arguments for comprehensive scanning
          args: >
            --ossIndexUsername chowjss@gmail.com
            --ossIndexPassword ${{ secrets.OSS_INDEX_TOKEN }}
            --enableRetired
            --enableExperimental
            --failOnCVSS 4.0

      - name: Upload Dependency-Check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-frontend-reports
          path: reports/*
          retention-days: 30

      #- name: Fail on security issues
      #  if: steps.depcheck.outcome == 'failure'
      #  run: |
      #    echo "❌ Security vulnerabilities found with CVSS score ≥ 4.0"
      #    echo "Please review the dependency-check report and update vulnerable dependencies."
      #    exit 1
  e2e-tests:
    runs-on: windows-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Authenticate Docker CLI to AWS ECR
        env:
          AWS_REGION: ap-southeast-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          npm install -g aws-cli
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ secrets.IMAGE_REGISTRY }}
      - name: Pull and run backend and database containers
        run: docker compose up
      - name: Get latest Edge version
        shell: powershell
        run: |
          # Get installed Edge version
          $edgePath = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (Test-Path $edgePath) {
              $edgeVersion = (Get-Item $edgePath).VersionInfo.ProductVersion
              Write-Host "Installed Edge version: $edgeVersion"
              echo "EDGE_VERSION=$edgeVersion" >> $env:GITHUB_ENV
          } else {
              Write-Host "Edge not found, using latest"
              $content = Invoke-WebRequest "https://learn.microsoft.com/en-us/deployedge/microsoft-edge-relnote-stable-channel"
              $content.Content -match 'Version (\d+\.\d+\.\d+\.\d+)' | Out-Null
              $edgeVersion = $Matches[1]
              echo "EDGE_VERSION=$edgeVersion" >> $env:GITHUB_ENV
          }
      - name: Run E2E tests
        env:
          EDGEDRIVER_VERSION: ${{env.EDGE_VERSION}}
        run: |
          npm install -g selenium-side-runner edgedriver
          npx edgedriver --version
          selenium-side-runner -c "browserName=MicrosoftEdge" tests/e2e/NUSHungryE2E_V2.side
