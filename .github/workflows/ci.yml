name: CI Pipeline for NUSHungry Frontend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || true

      - name: Check for unused dependencies
        run: npx depcheck || true
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --production=false

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        continue-on-error: true
        with:
          project: "NUSHungry-Frontend-main"
          path: "."
          format: "HTML"
          # Additional arguments for comprehensive scanning
          args: >
            --ossIndexUsername chowjss@gmail.com
            --ossIndexPassword ${{ secrets.OSS_INDEX_TOKEN }}
            --enableRetired
            --enableExperimental
            --failOnCVSS 4.0

      - name: Upload Dependency-Check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-frontend-reports
          path: reports/*
          retention-days: 30

      #- name: Fail on security issues
      #  if: steps.depcheck.outcome == 'failure'
      #  run: |
      #    echo "❌ Security vulnerabilities found with CVSS score ≥ 4.0"
      #    echo "Please review the dependency-check report and update vulnerable dependencies."
      #    exit 1
  container-scan:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build image for scanning
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          docker build -t frontend .
          docker image ls
          snyk container test frontend:latest --file=Dockerfile --severity-threshold=high --fail-on=upgradable
        continue-on-error: true
  e2e-tests:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Selenium dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Set up E2E test environment
        run: |
          npm install -g aws-cli
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{ secrets.IMAGE_REGISTRY }}
          docker pull ${{ secrets.IMAGE_REGISTRY }}/monolith-backend:latest
          docker compose up -d

          # Wait for services to be healthy
          echo "Waiting for services to be ready..."
          sleep 30

          docker compose ps

          # Wait for frontend to respond
          timeout 60 bash -c 'until curl -s http://localhost:80 > /dev/null; do echo "Waiting for frontend..."; sleep 2; done'
          echo "✓ Frontend is ready"
      - name: Run E2E tests
        run: python -m pytest tests/e2e/test_check_title.py
      - name: Teardown
        run: docker compose down
